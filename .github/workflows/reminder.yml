name: Codeforces Reminder Bot

on:
  schedule:
    - cron: '0 4 * * *'   # Runs daily at 04:00 UTC
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0   # fetch full history so rebase works

      - name: Restore database
        uses: actions/cache@v4
        with:
          path: /tmp/solved_problems.json
          key: cf-db-${{ github.run_id }}
          restore-keys: |
            cf-db-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          PHONE_NUMBER_ID: ${{ secrets.PHONE_NUMBER_ID }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: python main.py

      - name: Commit updated database
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add solved_problems.json
          git commit -m "Update solved problems" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
